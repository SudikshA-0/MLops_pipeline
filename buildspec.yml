version: 0.2

env:
  exported-variables:
    - IMAGE_URI

phases:
  build:
    commands:
      - |
        set -euo pipefail

        COMMIT_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-12)"
        IMAGE_TAG="${COMMIT_TAG}-${CODEBUILD_BUILD_NUMBER}"
        export IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
        ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"

        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
          | docker login --username AWS --password-stdin "$ECR_REGISTRY"

        docker run --rm \
          --volume "$CODEBUILD_SRC_DIR:/workspace" \
          --workdir /workspace \
          python:3.14-slim \
          sh -c 'python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt && python -m pytest -v'

        docker build --pull --tag "$IMAGE_URI" .
        docker push "$IMAGE_URI"

        printf '{"imageUri":"%s"}\n' "$IMAGE_URI" > image-detail.json

artifacts:
  files:
    - image-detail.json
